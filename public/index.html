<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AI Photo Detector</title>

  <style>
    body {
      background-color: lightblue;
      font-family: Arial;
      text-align: center;
    }

    .card {
      background-color: white;
      width: 85%;
      margin: 40px auto;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      color: red;
      font-size: 32px;
    }

    p {
      color: green;
    }

    #preview {
      width: 100%;
      max-width: 300px;
      margin-top: 20px;
      border-radius: 15px;
      display: none;
    }

    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background-color: #eeeeee;
      font-size: 18px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>AI Photo Detector</h1>

    <p>Photo upload करके check करें</p>

    <input type="file" id="photo" accept="image/*">

    <br>

    <img id="preview">

    <br>

    <button id="checkButton">Check Photo</button>

    <div id="result">
      Result यहाँ आएगा
    </div>

  </div>

  <script>

    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const checkButton = document.getElementById("checkButton");
    const result = document.getElementById("result");

    photo.addEventListener("change", function() {

      const file = photo.files[0];

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";

        result.style.display = "none";
      }

    });

    checkButton.addEventListener("click", function() {

      if (!photo.files[0]) {
        result.innerText = "पहले फोटो upload करें।";
        result.style.display = "block";
        return;
      }

      result.innerText = "Photo check हो रही है...";
      result.style.display = "block";

    });

  </script>

</body>

</html>
