<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Photo Detector</title>

  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: red;
    }

    input {
      margin: 15px 0;
      width: 100%;
    }

    img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 10px;
      display: none;
      margin: 15px auto;
    }

    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background-color: #eeeeee;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>AI Photo Detector</h1>

    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <img id="preview" alt="Photo Preview">

    <button onclick="checkPhoto()">
      Check Photo
    </button>

    <div id="result">
      Result यहाँ आएगा
    </div>

  </div>

  <script>
    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");

    photo.addEventListener("change", function () {
      const file = photo.files[0];

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        result.innerText = "Photo तैयार है।";
      }
    });

    async function checkPhoto() {
      const file = photo.files[0];

      if (!file) {
        result.innerText = "पहले फोटो upload करें।";
        return;
      }

      result.innerText = "Photo server पर भेजी जा रही है...";

      const formData = new FormData();
      formData.append("photo", file);

      try {
        const response = await fetch("/check", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        result.innerText = data.message || data.error;

      } catch (error) {
        result.innerText = "Server से connection नहीं हुआ।";
      }
    }
  </script>

</body>
    </html>
