<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Photo Detector</title>

  <!-- Logo -->
  <link rel="icon" type="image/png" href="/icon.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0000ff">

  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-sizing: border-box;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    h1 {
      color: red;
    }

    input {
      margin: 15px 0;
      width: 100%;
    }

    #preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 10px;
      display: none;
      margin: 15px auto;
    }

    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    button:disabled {
      background-color: gray;
      cursor: not-allowed;
    }

    #installButton {
      display: none;
      background-color: green;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background-color: #eeeeee;
      font-size: 18px;
    }

    .real {
      background-color: #d9ffd9;
      color: green;
    }

    .ai {
      background-color: #ffd9d9;
      color: red;
    }

    .uncertain {
      background-color: #fff3cd;
      color: #856404;
    }

    .confidence {
      font-size: 15px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- App Logo -->
    <img
      class="logo"
      src="/icon.png"
      alt="AI Photo Detector Logo"
    >

    <h1>AI Photo Detector</h1>

    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <img
      id="preview"
      alt="Photo Preview"
    >

    <br>

    <button
      id="checkButton"
      onclick="checkPhoto()"
    >
      Check Photo
    </button>

    <button
      id="installButton"
      onclick="installApp()"
    >
      📲 Install App
    </button>

    <div id="result">
      Result यहाँ आएगा
    </div>

  </div>


  <script>
    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");
    const checkButton = document.getElementById("checkButton");
    const installButton = document.getElementById("installButton");

    let deferredPrompt = null;


    /* Photo Preview */

    photo.addEventListener("change", function () {

      const file = photo.files[0];

      if (file) {

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";

        result.className = "";

        result.innerText = "Photo तैयार है।";
      }
    });


    /* AI Photo Check */

    async function checkPhoto() {

      const file = photo.files[0];

      if (!file) {

        result.className = "uncertain";

        result.innerText =
          "पहले फोटो upload करें।";

        return;
      }


      checkButton.disabled = true;

      result.className = "";

      result.innerText =
        "Photo check हो रही है...";


      const formData = new FormData();

      formData.append("photo", file);


      try {

        const response = await fetch("/check", {

          method: "POST",

          body: formData

        });


        const text = await response.text();


        if (!response.ok) {

          result.className = "uncertain";

          result.innerText =
            "Error: " + text;

          checkButton.disabled = false;

          return;
        }


        const data = JSON.parse(text);


        const aiData =
          data.report &&
          data.report.ai_generated;


        if (!aiData) {

          result.className = "uncertain";

          result.innerText =
            "Result समझ नहीं आया।";

          checkButton.disabled = false;

          return;
        }


        const verdict = aiData.verdict;


        const aiConfidence =
          aiData.ai.confidence;


        const humanConfidence =
          aiData.human.confidence;


        if (verdict === "human") {

          result.className = "real";

          result.innerHTML =
            "🟢 Likely Real" +
            '<div class="confidence">' +
            "Confidence: " +
            (humanConfidence * 100).toFixed(2) +
            "%" +
            "</div>";

        }


        else if (verdict === "ai") {

          result.className = "ai";

          result.innerHTML =
            "🔴 Likely AI-generated" +
            '<div class="confidence">' +
            "Confidence: " +
            (aiConfidence * 100).toFixed(2) +
            "%" +
            "</div>";

        }


        else {

          result.className = "uncertain";

          result.innerHTML =
            "🟡 Uncertain" +
            '<div class="confidence">' +
            "AI confidence: " +
            (aiConfidence * 100).toFixed(2) +
            "%" +
            "</div>";
        }

      }


      catch (error) {

        console.error(error);

        result.className = "uncertain";

        result.innerText =
          "Error: " + error.message;
      }


      checkButton.disabled = false;
    }


    /* Install App */

    window.addEventListener(
      "beforeinstallprompt",
      function (event) {

        event.preventDefault();

        deferredPrompt = event;

        installButton.style.display = "inline-block";
      }
    );


    async function installApp() {

      if (!deferredPrompt) {

        alert(
          "Install option अभी उपलब्ध नहीं है। Chrome के menu ⋮ से 'Install app' या 'Add to Home screen' देखें।"
        );

        return;
      }


      deferredPrompt.prompt();


      const result =
        await deferredPrompt.userChoice;


      console.log(
        "Install result:",
        result.outcome
      );


      deferredPrompt = null;

      installButton.style.display = "none";
    }


    /* App Installed */

    window.addEventListener(
      "appinstalled",
      function () {

        installButton.style.display = "none";

        console.log("App installed");
      }
    );
  </script>

</body>

</html>
